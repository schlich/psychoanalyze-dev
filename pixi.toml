[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
description = "Psychoanalyze"

[pypi-dependencies]
psychoanalyze = { path = ".", editable = true }

[feature.dev.dependencies]
nushell = "*"
go = "*"
gcc = "*"
# allure: CLI not on conda-forge; use allure-pytest from pyproject dev deps for reporting

[feature.dev.tasks]
shell = "exec nu"

[feature.docs]

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[dependencies]
pymc = ">=5.27.1,<6"
marimo = ">=0.19.8,<0.20"
mcp = ">=1.26.0,<2"
openai = ">=2.20.0,<3"
pydantic-ai-slim = ">=1.58.0,<2"
arviz-base = ">=0.8.2,<0.9"
arviz-stats = ">=0.8.0,<0.9"
arviz-plots = ">=0.8.0,<0.9"
ruff = ">=0.15.0,<0.16"
ty = ">=0.0.16,<0.0.17"
